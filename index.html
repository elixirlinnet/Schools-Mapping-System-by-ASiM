<!DOCTYPE html>
<html>
<head>
  <title>Schools Mapping System by ASiM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="header">
    <h2>Schools Mapping System by ASiM</h2>
    <p id="subtitle">DEA Khushab - ASiM</p>
  </div>

  <div class="controls" id="controls">
    <div class="row search-row">
      <input type="text" id="searchBox" placeholder="Search school...">
      <button onclick="searchSchool()">Search</button>
      <button class="btn-secondary" onclick="clearSearch()">Clear</button>
    </div>

    <button
      class="btn-secondary filter-toggle"
      id="filterToggle"
      type="button"
      onclick="toggleFilterPanel()"
      aria-expanded="false"
      aria-controls="filterPanel"
    >
      <span>Filters</span>
      <span class="filter-toggle-meta" id="filterToggleMeta">All</span>
      <span class="filter-toggle-icon">&#9662;</span>
    </button>

    <div class="filter-panel" id="filterPanel">
      <div class="row filter-row">
        <div class="dropdown">
          <button data-filter-button="tehsilFilterBox" onclick="toggleDropdown('tehsilFilterBox')" aria-haspopup="true" aria-expanded="false" aria-controls="tehsilFilterBox">Tehsil &#9662;</button>
          <div id="tehsilFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="markazFilterBox" onclick="toggleDropdown('markazFilterBox')" aria-haspopup="true" aria-expanded="false" aria-controls="markazFilterBox">Markaz &#9662;</button>
          <div id="markazFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="genderFilterBox" onclick="toggleDropdown('genderFilterBox')" aria-haspopup="true" aria-expanded="false" aria-controls="genderFilterBox">Gender &#9662;</button>
          <div id="genderFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="levelFilterBox" onclick="toggleDropdown('levelFilterBox')" aria-haspopup="true" aria-expanded="false" aria-controls="levelFilterBox">Level &#9662;</button>
          <div id="levelFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="categoryFilterBox" onclick="toggleDropdown('categoryFilterBox')" aria-haspopup="true" aria-expanded="false" aria-controls="categoryFilterBox">Category &#9662;</button>
          <div id="categoryFilterBox" class="dropdown-content"></div>
        </div>
      </div>

      <div class="filter-summary" id="filterSummary">Showing 0 schools</div>
    </div>
  </div>
  <div id="map"></div>
  <button
    class="legend-toggle"
    id="legendToggle"
    type="button"
    onclick="toggleLegend()"
    aria-expanded="false"
    aria-controls="legend"
  >Legend</button>
  <div id="legend"></div>
  <div class="stats" id="statsBox"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="csv-parser.js"></script>
  <script src="schools-data.js"></script>

  <script src="app.js"></script>
</body>
</html>
