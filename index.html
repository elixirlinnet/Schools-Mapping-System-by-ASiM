<!DOCTYPE html>
<html>
<head>
  <title>Schools Mapping System by ASiM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="header">
    <h2>Schools Mapping System by ASiM</h2>
    <p id="subtitle">DEA Khushab - ASiM</p>
  </div>

  <div class="controls" id="controls">
    <div class="row search-row">
      <input type="text" id="searchBox" placeholder="Search school...">
      <button onclick="searchSchool()">Search</button>
      <button class="btn-secondary" onclick="clearSearch()">Clear</button>
    </div>

    <button
      class="btn-secondary filter-toggle"
      id="filterToggle"
      type="button"
      onclick="toggleFilterPanel()"
      aria-expanded="false"
      aria-controls="filterPanel"
    >
      <span>Filters</span>
      <span class="filter-toggle-meta" id="filterToggleMeta">All</span>
      <span class="filter-toggle-icon">&#9662;</span>
    </button>

    <div class="filter-panel" id="filterPanel">
      <div class="row filter-row">
        <div class="dropdown">
          <button data-filter-button="tehsilFilterBox" onclick="toggleDropdown('tehsilFilterBox')">Tehsil &#9662;</button>
          <div id="tehsilFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="markazFilterBox" onclick="toggleDropdown('markazFilterBox')">Markaz &#9662;</button>
          <div id="markazFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="genderFilterBox" onclick="toggleDropdown('genderFilterBox')">Gender &#9662;</button>
          <div id="genderFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="levelFilterBox" onclick="toggleDropdown('levelFilterBox')">Level &#9662;</button>
          <div id="levelFilterBox" class="dropdown-content"></div>
        </div>

        <div class="dropdown">
          <button data-filter-button="categoryFilterBox" onclick="toggleDropdown('categoryFilterBox')">Category &#9662;</button>
          <div id="categoryFilterBox" class="dropdown-content"></div>
        </div>
      </div>

      <div class="filter-summary" id="filterSummary">Showing 0 schools</div>
    </div>
  </div>
  <div id="map"></div>
  <button
    class="legend-toggle"
    id="legendToggle"
    type="button"
    onclick="toggleLegend()"
    aria-expanded="false"
    aria-controls="legend"
  >Legend</button>
  <div id="legend"></div>
  <div class="stats" id="statsBox"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="schools-data.js"></script>

  <script src="app.js"></script>
</body>
</html>
